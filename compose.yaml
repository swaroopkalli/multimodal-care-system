services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Flask runs directly on the host in this repository; limit access to loopback.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Available only to containers on this Compose network; do not publish 11434.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  ollama_models:
